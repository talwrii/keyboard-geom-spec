[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keygeom"
version = "0.1.0"
description = "A format for describing the physical key layout of keyboards, numpads and macropads, with a validator and a recorder"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["evdev"]

[[project.authors]]
name = "readwithai"

[project.scripts]
keygeom = "keygeom.cli:main"

[tool.setuptools]
packages = ["keygeom"]
